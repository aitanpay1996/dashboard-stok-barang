<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Stok Barang</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Advanced Tech Inventory</p>
        <h1>Dashboard Stok Barang</h1>
        <p class="subtitle">Data otomatis dibaca dari Google Spreadsheet dan ditampilkan dalam 5 jenis barang.</p>
      </div>
      <div class="hero-actions">
        <button id="refreshBtn" class="primary-btn">Refresh Data</button>
        <p id="lastUpdated" class="last-updated">Belum dimuat</p>
      </div>
    </header>

    <section id="statusBox" class="status-box hidden"></section>

    <section class="summary-grid" id="summaryGrid">
      <article class="summary-card skeleton"></article>
      <article class="summary-card skeleton"></article>
      <article class="summary-card skeleton"></article>
      <article class="summary-card skeleton"></article>
      <article class="summary-card skeleton"></article>
    </section>

    <section class="dashboard-panel">
      <nav class="tabs" aria-label="Jenis barang">
        <button class="tab active" data-type="raw">Barang Mentah</button>
        <button class="tab" data-type="semi">Barang Setengah Jadi</button>
        <button class="tab" data-type="full">Barang Full Rakit</button>
        <button class="tab" data-type="return">Barang Return</button>
        <button class="tab" data-type="damaged">Barang Rusak</button>
      </nav>

      <div class="panel-toolbar">
        <div>
          <h2 id="panelTitle">Barang Mentah</h2>
          <p id="panelDescription">Semua data dari link 1 kecuali LAYAR/屏幕 dan BARANG JADI/成品.</p>
        </div>
        <div class="filters">
          <input id="searchInput" type="search" placeholder="Cari nama, kategori, seri, customer..." />
          <select id="categoryFilter">
            <option value="all">Semua kategori</option>
          </select>
        </div>
      </div>

      <section class="mini-chart-card">
        <div class="mini-chart-header">
          <h3 id="chartTitle">Ringkasan kategori</h3>
          <p id="chartNote">Menampilkan total stok/kuantitas per kategori.</p>
        </div>
        <div id="miniChart" class="mini-chart"></div>
      </section>

      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
